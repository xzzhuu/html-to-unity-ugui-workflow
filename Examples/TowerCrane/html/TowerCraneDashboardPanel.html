<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920,height=1080,initial-scale=1" />
  <title>Tower Crane Dashboard 1920x1080</title>
  <link rel="stylesheet" href="TowerCraneDashboardPanel.css" />
</head>
<body>
<div id="TowerCraneDashboardPanel" data-panel-name="TowerCraneDashboardPanel" data-ugui="Container" data-root="true" data-asset-prefix="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/" style="width:1920px;height:1080px;" data-output-folder="Assets/Art/UIPrefab/TowerCraneDashboardPanel">
  <div id="Header" class="header" data-ui-name="Group_Header" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/decor/header_bg.png">
    <img class="header-logo" src="assets/icons/crane.png" data-ui-name="Img_Logo" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/crane.png" id="Img_Logo" />
    <span class="header-title" data-ui-name="Txt_HeaderTitle" data-ugui="Text" id="Txt_Title">塔吊监控面板</span>
    <span class="header-device" data-ui-name="Txt_HeaderDeviceAndUpdate" data-ugui="Text" data-binding="Header.DeviceAndUpdate" id="Txt_HeaderDeviceAndUpdate">当前设备：TC001 / 塔吊1　|　更新时间：2026-09-24 14:24:35</span>
    <button class="refresh-btn btn" data-ui-name="Btn_Refresh" data-ugui="Button" data-binding="Action.Refresh" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/button_blue.png" data-nine-slice="true" data-border="18,18,18,18" id="Btn_Refresh">
      <img class="button-icon" src="assets/icons/refresh.png" data-ui-name="Img_RefreshIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/refresh.png" id="Img_Icon" />
      <span class="button-label" data-ui-name="Txt_RefreshLabel" data-ugui="Text" id="Txt_Label">刷新</span>
    </button>
    <button class="home-btn btn btn-secondary" data-ui-name="Btn_Home" data-ugui="Button" data-binding="Action.Home" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/button_dark.png" data-nine-slice="true" data-border="18,18,18,18" id="Btn_Home">
      <img class="button-icon" src="assets/icons/home.png" data-ui-name="Img_HomeIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/home.png" id="Img_Icon_1" />
      <span class="button-label" data-ui-name="Txt_HomeLabel" data-ugui="Text" id="Txt_Label_1">返回主页</span>
    </button>
  </div>

  <div id="DevicePanel" class="left-panel panel" data-ui-name="Group_Device" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/panel.png" data-nine-slice="true" data-border="24,24,24,24">
    <span class="left-title section-title" data-ui-name="Txt_DeviceTitle" data-ugui="Text" id="Txt_Title_1">设备列表</span>
    <span class="count-text" data-ui-name="Txt_DeviceCount" data-ugui="Text" data-binding="Device.Count" id="Txt_DeviceCount">共 4 台</span>
    <div class="search-wrap" data-ui-name="Group_Search" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/button_dark.png" data-nine-slice="true" data-border="18,18,18,18" id="Group_Search">
      <img class="search-icon" src="assets/icons/search.png" data-ui-name="Img_SearchIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/search.png" id="Img_SearchIcon" />
      <input class="search" data-ui-name="Input_DeviceSearch" data-ugui="InputField" data-binding="Device.Search" placeholder="搜索设备名称或编号..." id="Input_DeviceSearch" />
    </div>
    <div class="device-list" data-ui-name="Scroll_DeviceList" data-ugui="ScrollView" data-binding="Device.List" style="content-height:512px" id="Scroll_DeviceList">
      <template id="DeviceItemTemplate" data-prefab="DeviceItem"><button data-preview-template="DeviceItem" class="device-item" data-ui-name="Item_Device" data-ugui="Button" data-binding="DeviceItem.Button" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/button_dark.png" data-normal-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/button_dark.png" data-selected-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/device_selected.png" data-nine-slice="true" data-border="18,18,18,18" id="Item_Device"><img class="device-crane" src="assets/icons/crane.png" data-ui-name="Img_DeviceIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/crane.png" id="Img_Icon_2" /><span class="device-code" data-ui-name="Txt_DeviceItemCode" data-ugui="Text" data-binding="DeviceItem.Code" id="Txt_DeviceItemCode">TC001</span><span class="device-name" data-ui-name="Txt_DeviceItemName" data-ugui="Text" data-binding="DeviceItem.Name" id="Txt_DeviceItemName">塔吊1</span><img class="device-arrow" src="assets/icons/arrow.png" data-ui-name="Img_Arrow" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/arrow.png" id="Img_Arrow" /></button></template></div>
    <div class="left-empty-hint" data-ui-name="Txt_EmptyHint" data-ugui="Text" id="Txt_EmptyHint">选择设备查看实时状态与历史趋势</div>
  </div>

  <div id="CenterPanel" class="center" data-ui-name="Group_Main" data-ugui="Container">
    <div id="RealtimeMetrics" class="metrics" data-ui-name="Group_RealtimeMetrics" data-ugui="Container">
      <div class="metric-card" data-ui-name="Group_HeightMMetric" data-ugui="Image" style="left:0px;top:0px" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/card.png" data-nine-slice="true" data-border="22,22,22,22" id="Group_HeightMMetric">
        <div class="metric-icon-box" data-ui-name="Group_HeightMMetricIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/button_dark.png" data-nine-slice="true" data-border="18,18,18,18" id="Group_Icon"><img class="metric-icon" src="assets/icons/height.png" data-ui-name="Img_HeightMMetricIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/height.png" id="Img_Icon_3" /></div>
        <span class="metric-label" data-ui-name="Txt_HeightMMetricLabel" data-ugui="Text" id="Txt_Label_2">高度</span><span class="metric-value height-value" data-ui-name="Txt_RealtimeHeightM" data-ugui="Text" data-binding="Realtime.HeightM" id="Txt_RealtimeHeightM">59.6</span><span class="metric-unit" data-ui-name="Txt_HeightMMetricUnit" data-ugui="Text" id="Txt_Unit">m</span>
      </div>
      <div class="metric-card" data-ui-name="Group_RadiusMMetric" data-ugui="Image" style="left:373px;top:0px" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/card.png" data-nine-slice="true" data-border="22,22,22,22" id="Group_RadiusMMetric">
        <div class="metric-icon-box" data-ui-name="Group_RadiusMMetricIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/button_dark.png" data-nine-slice="true" data-border="18,18,18,18" id="Group_Icon_1"><img class="metric-icon" src="assets/icons/radius.png" data-ui-name="Img_RadiusMMetricIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/radius.png" id="Img_Icon_4" /></div>
        <span class="metric-label" data-ui-name="Txt_RadiusMMetricLabel" data-ugui="Text" id="Txt_Label_3">幅度</span><span class="metric-value radius-value" data-ui-name="Txt_RealtimeRadiusM" data-ugui="Text" data-binding="Realtime.RadiusM" id="Txt_RealtimeRadiusM">35.5</span><span class="metric-unit" data-ui-name="Txt_RadiusMMetricUnit" data-ugui="Text" id="Txt_Unit_1">m</span>
      </div>
      <div class="metric-card" data-ui-name="Group_SlewAngleDegMetric" data-ugui="Image" style="left:746px;top:0px" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/card.png" data-nine-slice="true" data-border="22,22,22,22" id="Group_SlewAngleDegMetric">
        <div class="metric-icon-box" data-ui-name="Group_SlewAngleDegMetricIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/button_dark.png" data-nine-slice="true" data-border="18,18,18,18" id="Group_Icon_2"><img class="metric-icon" src="assets/icons/rotate.png" data-ui-name="Img_SlewAngleDegMetricIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/rotate.png" id="Img_Icon_5" /></div>
        <span class="metric-label" data-ui-name="Txt_SlewAngleDegMetricLabel" data-ugui="Text" id="Txt_Label_4">回转角度</span><span class="metric-value rotation-value" data-ui-name="Txt_RealtimeSlewAngleDeg" data-ugui="Text" data-binding="Realtime.SlewAngleDeg" id="Txt_RealtimeSlewAngleDeg">274.0</span><span class="metric-unit" data-ui-name="Txt_SlewAngleDegMetricUnit" data-ugui="Text" id="Txt_Unit_2">°</span>
      </div>
      <div class="metric-card" data-ui-name="Group_LoadTMetric" data-ugui="Image" style="left:0px;top:126px" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/card.png" data-nine-slice="true" data-border="22,22,22,22" id="Group_LoadTMetric">
        <div class="metric-icon-box" data-ui-name="Group_LoadTMetricIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/button_dark.png" data-nine-slice="true" data-border="18,18,18,18" id="Group_Icon_3"><img class="metric-icon" src="assets/icons/load.png" data-ui-name="Img_LoadTMetricIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/load.png" id="Img_Icon_6" /></div>
        <span class="metric-label" data-ui-name="Txt_LoadTMetricLabel" data-ugui="Text" id="Txt_Label_5">吊重</span><span class="metric-value load-value" data-ui-name="Txt_RealtimeLoadT" data-ugui="Text" data-binding="Realtime.LoadT" id="Txt_RealtimeLoadT">0.0</span><span class="metric-unit" data-ui-name="Txt_LoadTMetricUnit" data-ugui="Text" id="Txt_Unit_3">t</span>
      </div>
      <div class="metric-card" data-ui-name="Group_TiltAngleDegMetric" data-ugui="Image" style="left:373px;top:126px" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/card.png" data-nine-slice="true" data-border="22,22,22,22" id="Group_TiltAngleDegMetric">
        <div class="metric-icon-box" data-ui-name="Group_TiltAngleDegMetricIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/button_dark.png" data-nine-slice="true" data-border="18,18,18,18" id="Group_Icon_4"><img class="metric-icon" src="assets/icons/tilt.png" data-ui-name="Img_TiltAngleDegMetricIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/tilt.png" id="Img_Icon_7" /></div>
        <span class="metric-label" data-ui-name="Txt_TiltAngleDegMetricLabel" data-ugui="Text" id="Txt_Label_6">倾角</span><span class="metric-value tilt-value" data-ui-name="Txt_RealtimeTiltAngleDeg" data-ugui="Text" data-binding="Realtime.TiltAngleDeg" id="Txt_RealtimeTiltAngleDeg">7.7</span><span class="metric-unit" data-ui-name="Txt_TiltAngleDegMetricUnit" data-ugui="Text" id="Txt_Unit_4">°</span>
      </div>
      <div class="metric-card" data-ui-name="Group_WindSpeedMpsMetric" data-ugui="Image" style="left:746px;top:126px" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/card.png" data-nine-slice="true" data-border="22,22,22,22" id="Group_WindSpeedMpsMetric">
        <div class="metric-icon-box" data-ui-name="Group_WindSpeedMpsMetricIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/button_dark.png" data-nine-slice="true" data-border="18,18,18,18" id="Group_Icon_5"><img class="metric-icon" src="assets/icons/wind.png" data-ui-name="Img_WindSpeedMpsMetricIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/wind.png" id="Img_Icon_8" /></div>
        <span class="metric-label" data-ui-name="Txt_WindSpeedMpsMetricLabel" data-ugui="Text" id="Txt_Label_7">风速</span><span class="metric-value wind-value" data-ui-name="Txt_RealtimeWindSpeedMps" data-ugui="Text" data-binding="Realtime.WindSpeedMps" id="Txt_RealtimeWindSpeedMps">0.5</span><span class="metric-unit unit-wide" data-ui-name="Txt_WindSpeedMpsMetricUnit" data-ugui="Text" id="Txt_Unit_5">m/s</span>
      </div>
    </div>

    <div id="HistoryPanel" class="history panel" data-ui-name="Group_History" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/panel.png" data-nine-slice="true" data-border="24,24,24,24">
      <div class="history-titlebar" data-ui-name="Group_HistoryTitlebar" data-ugui="Container" id="Group_Titlebar"><img class="history-main-icon" src="assets/icons/chart.png" data-ui-name="Img_HistoryTitlebarTitleIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/chart.png" id="Img_TitleIcon" /><span class="history-title" data-ui-name="Txt_HistoryTitlebarTitle" data-ugui="Text" id="Txt_Title_2">历史趋势数据</span></div>
      <div class="chart-card" data-ui-name="Group_HeightTrend" data-ugui="Image" style="left:14px;top:54px" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/chart_frame.png" data-nine-slice="true" data-border="24,24,24,24" id="Group_HeightTrend"><img class="chart-title-icon" src="assets/icons/height.png" data-ui-name="Img_HeightTrendIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/height.png" id="Img_Icon_9" /><span class="chart-title" data-ui-name="Txt_HeightTrendTitle" data-ugui="Text" id="Txt_Title_3">高度趋势</span><img class="chart-plot" src="assets/textures/charts/TC001/height.png" data-ui-name="RawImg_HistoryHeight" data-ugui="RawImage" data-binding="History.Height" data-texture="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/textures/charts/TC001/height.png" id="RawImg_HistoryHeight" /></div>
      <div class="chart-card" data-ui-name="Group_RadiusTrend" data-ugui="Image" style="left:550px;top:54px" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/chart_frame.png" data-nine-slice="true" data-border="24,24,24,24" id="Group_RadiusTrend"><img class="chart-title-icon" src="assets/icons/radius.png" data-ui-name="Img_RadiusTrendIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/radius.png" id="Img_Icon_10" /><span class="chart-title" data-ui-name="Txt_RadiusTrendTitle" data-ugui="Text" id="Txt_Title_4">幅度趋势</span><img class="chart-plot" src="assets/textures/charts/TC001/radius.png" data-ui-name="RawImg_HistoryRadius" data-ugui="RawImage" data-binding="History.Radius" data-texture="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/textures/charts/TC001/radius.png" id="RawImg_HistoryRadius" /></div>
      <div class="chart-card" data-ui-name="Group_LoadTrend" data-ugui="Image" style="left:14px;top:366px" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/chart_frame.png" data-nine-slice="true" data-border="24,24,24,24" id="Group_LoadTrend"><img class="chart-title-icon" src="assets/icons/load.png" data-ui-name="Img_LoadTrendIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/load.png" id="Img_Icon_11" /><span class="chart-title" data-ui-name="Txt_LoadTrendTitle" data-ugui="Text" id="Txt_Title_5">吊重趋势</span><img class="chart-plot" src="assets/textures/charts/TC001/load.png" data-ui-name="RawImg_HistoryLoad" data-ugui="RawImage" data-binding="History.Load" data-texture="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/textures/charts/TC001/load.png" id="RawImg_HistoryLoad" /></div>
      <div class="chart-card" data-ui-name="Group_WindSpeedTrend" data-ugui="Image" style="left:550px;top:366px" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/chart_frame.png" data-nine-slice="true" data-border="24,24,24,24" id="Group_WindSpeedTrend"><img class="chart-title-icon" src="assets/icons/wind.png" data-ui-name="Img_WindSpeedTrendIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/wind.png" id="Img_Icon_12" /><span class="chart-title" data-ui-name="Txt_WindSpeedTrendTitle" data-ugui="Text" id="Txt_Title_6">风速趋势</span><img class="chart-plot" src="assets/textures/charts/TC001/wind_speed.png" data-ui-name="RawImg_HistoryWindSpeed" data-ugui="RawImage" data-binding="History.WindSpeed" data-texture="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/textures/charts/TC001/wind_speed.png" id="RawImg_HistoryWindSpeed" /></div>
    </div>
  </div>

  <div id="AlarmPanel" class="right-panel panel" data-ui-name="Group_Alarm" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/panel.png" data-nine-slice="true" data-border="24,24,24,24">
    <img class="alarm-title-icon" src="assets/icons/alarm.png" data-ui-name="Img_AlarmTitleIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/alarm.png" id="Img_TitleIcon_1" /><span class="alarm-title section-title" data-ui-name="Txt_AlarmTitle" data-ugui="Text" id="Txt_Title_7">报警状态</span><span class="alarm-count" data-ui-name="Txt_AlarmCount" data-ugui="Text" data-binding="Alarm.Count" id="Txt_AlarmCount">共 9 项</span>
    <div class="summary-card summary-normal" data-ui-name="Group_NormalSummary" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/status_green.png" data-nine-slice="true" data-border="18,18,18,18" id="Group_NormalSummary"><img class="summary-icon" src="assets/icons/check_green.png" data-ui-name="Img_NormalSummaryIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/check_green.png" id="Img_Icon_13" /><span class="summary-label" data-ui-name="Txt_NormalSummaryLabel" data-ugui="Text" id="Txt_Label_8">正常</span><span class="summary-value" data-ui-name="Txt_AlarmNormalCount" data-ugui="Text" data-binding="Alarm.NormalCount" id="Txt_AlarmNormalCount">8</span></div>
    <div class="summary-card summary-alarm" data-ui-name="Group_AlarmSummary" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/status_red.png" data-nine-slice="true" data-border="18,18,18,18" id="Group_AlarmSummary"><img class="summary-icon" src="assets/icons/warning_red.png" data-ui-name="Img_AlarmSummaryIcon" data-ugui="Image" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/icons/warning_red.png" id="Img_Icon_14" /><span class="summary-label" data-ui-name="Txt_AlarmSummaryLabel" data-ugui="Text" id="Txt_Label_9">报警</span><span class="summary-value" data-ui-name="Txt_AlarmActiveCount" data-ugui="Text" data-binding="Alarm.ActiveCount" id="Txt_AlarmActiveCount">1</span></div>
    <div class="alarm-list" data-ui-name="Scroll_AlarmList" data-ugui="ScrollView" data-binding="Alarm.List" style="content-height:610px" id="Scroll_AlarmList">
      <template id="AlarmItemTemplate" data-prefab="AlarmItem"><div data-preview-template="AlarmItem" class="alarm-item" data-ui-name="Item_Alarm" data-ugui="Container" data-binding="AlarmItem.Root" id="Item_Alarm"><span class="alarm-dot dot-normal" data-ui-name="Img_AlarmItemDot" data-ugui="Image" data-binding="AlarmItem.Dot" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/dot.png" id="Img_AlarmItemDot"></span><span class="alarm-name" data-ui-name="Txt_AlarmItemName" data-ugui="Text" data-binding="AlarmItem.Name" id="Txt_AlarmItemName">倾斜报警</span><div class="status-pill status-normal" data-ui-name="Img_AlarmItemPill" data-ugui="Image" data-binding="AlarmItem.Pill" data-selected-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/pill_red.png" data-sprite="Assets/Art/UI/Sprite/TowerCraneDashboardPanel/sprites/pill_green.png" data-nine-slice="true" data-border="14,14,14,14" id="Img_AlarmItemPill"><span class="status-pill-text" data-ui-name="Txt_AlarmItemStatusText" data-ugui="Text" data-binding="AlarmItem.StatusText" id="Txt_AlarmItemStatusText">正常</span></div></div></template></div>
  </div>
</div>
<script src="preview-data.js"></script>
<script src="TowerCraneDashboardPanel.preview.js"></script>
</body>
</html>
