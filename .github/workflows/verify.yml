name: Verify workflow and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -X utf8 -m unittest discover -s Skills/ui-panel-design-to-html/scripts -p "test*.py"
      - run: python -X utf8 Tools/game-workflow.py check --root Workspaces/StarportSalvage
      - run: python -X utf8 Tools/verify-directory-generator.py
      - run: python -X utf8 Tools/verify-preparation-contract.py
      - run: python -X utf8 Tools/verify-installer.py
      - run: python -X utf8 Tools/verify-workflow-files.py
      - run: python -X utf8 Tools/verify-file-integrity.py
      - run: python -X utf8 Tools/build-unity-package.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: upm-package-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:skill
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:browser
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: starport-browser-evidence
          path: Audit/Runs/latest/starport-browser
