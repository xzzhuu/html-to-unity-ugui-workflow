name: Unity release gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unity:
    runs-on: [self-hosted, Windows, Unity2022]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate the prepared project and current package
        shell: pwsh
        run: python -X utf8 Tools/verify-unity-release.py --editor "$env:UNITY_EDITOR_PATH" --project "$env:UNITY_VALIDATION_PROJECT" --evidence "$env:RUNNER_TEMP/html-ui-release"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: unity-release-evidence
          path: ${{ runner.temp }}/html-ui-release
